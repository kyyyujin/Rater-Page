<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export pipeline diagnostic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b0f;color:#fff;font-family:Arial,sans-serif}
body{padding:24px}.title{font-size:20px;margin:0 0 8px}.note{opacity:.7;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(5,240px);gap:18px;width:max-content}
.case{width:240px}.label{margin:8px 0;font-weight:700}
.bg{position:relative;width:240px;height:190px;padding:18px;overflow:hidden;border-radius:24px;background:
radial-gradient(circle at 20% 25%,#42c9ff 0 18%,transparent 42%),
radial-gradient(circle at 78% 22%,#f1d53f 0 14%,transparent 42%),
radial-gradient(circle at 65% 78%,#ec405f 0 16%,transparent 44%),
linear-gradient(135deg,#1b7238,#192447 55%,#75502a)}
.panel{position:relative;width:100%;height:100%;border-radius:22px;padding:16px;overflow:visible;border:1px solid rgba(158,223,211,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.025),0 20px 46px rgba(0,0,0,.11);color:white}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:24px;background:rgba(0,0,0,.55)}
.panel:after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:rgba(0,0,0,.55)}
.basic{background:#26333a;border-radius:0;border:0;box-shadow:none}
.basic:before,.basic:after,.nopseudo:before,.nopseudo:after{content:none}
.flat{background:linear-gradient(128deg,rgba(147,194,199,.11),rgba(28,39,42,.13) 42%,rgba(106,86,52,.095))}
.glass,.nopseudo{background-color:rgba(18,29,33,.16);background-image:linear-gradient(128deg,rgba(147,194,199,.11),rgba(28,39,42,.13) 42%,rgba(106,86,52,.095));backdrop-filter:blur(20px) saturate(1.18);-webkit-backdrop-filter:blur(20px) saturate(1.18)}
.capturelike{overflow:hidden;backdrop-filter:none;-webkit-backdrop-filter:none;background-color:rgba(30,43,47,.24);background-image:linear-gradient(128deg,rgba(133,174,179,.16),rgba(34,47,50,.20) 46%,rgba(111,91,59,.13))}
.capturelike:before,.capturelike:after{content:none}
.row{position:relative;z-index:2;display:grid;grid-template-columns:30px 1fr auto;align-items:center;height:48px;border-bottom:1px solid rgba(255,255,255,.115)}
.row:last-child{border:0}.score{padding:7px 10px;border:1px solid rgba(177,210,222,.23);border-radius:11px;background:rgba(108,132,141,.27)}
.result{margin-top:10px;width:240px;background:#12161b;border:1px solid #333;min-height:190px}
.result img{display:block;width:240px;height:auto}.metric{font:11px monospace;color:#9fb1ba;margin-top:6px;white-space:pre-wrap}
</style>
</head>
<body>
<h1 class="title">html2canvas 1.4.1 — matriz aislada</h1>
<p class="note">Arriba: DOM de Chrome · Abajo: PNG del mismo renderer</p>
<div class="grid" id="grid"></div>
<script>
const cases=[["Control básico","basic"],["Glass sin backdrop","flat"],["Glass con backdrop","glass"],["Backdrop sin pseudos","nopseudo"],["Regla actual de captura","capturelike"]];
const grid=document.getElementById("grid");
for(const [name,cls] of cases){
  const c=document.createElement("div");
  c.className="case";
  c.innerHTML='<div class="label">'+name+'</div><div class="bg"><div class="panel '+cls+'"><div class="row"><span>01</span><span>Track one</span><b class="score">9.0</b></div><div class="row"><span>02</span><span>Track two</span><b class="score">8.8</b></div><div class="row"><span>03</span><span>Track three</span><b class="score">9.1</b></div></div></div><div class="result"></div><div class="metric">pendiente</div>';
  grid.append(c);
}
async function run(){
  await document.fonts.ready;
  await new Promise(r=>setTimeout(r,500));
  for(const c of document.querySelectorAll(".case")){
    const canvas=await html2canvas(c.querySelector(".bg"),{
      backgroundColor:null,scale:2,useCORS:true,allowTaint:true,logging:false,
      ignoreElements:()=>false,onclone:d=>{d.documentElement.dataset.capture="1";}
    });
    const img=new Image();
    img.alt="PNG rasterizado";
    img.src=canvas.toDataURL("image/png");
    c.querySelector(".result").append(img);
    const ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;
    const lum=y=>{const p=ctx.getImageData(0,y,w,1).data;let s=0;for(let i=0;i<p.length;i+=4)s+=(p[i]+p[i+1]+p[i+2])/3;return s/(p.length/4)};
    const ys=[4,20,48,100,190,330,372].filter(y=>y<h);
    c.querySelector(".metric").textContent=canvas.width+"x"+canvas.height+" | "+ys.map(y=>y+":"+lum(y).toFixed(0)).join(" ");
  }
  document.body.dataset.done="yes";
}
run().catch(e=>{document.body.dataset.done="error";document.body.dataset.err=e.stack||e.message});
</script>
</body>
</html>
