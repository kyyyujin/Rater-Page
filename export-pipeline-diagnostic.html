<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export pipeline diagnostic — clone matrix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b0f;color:#fff;font-family:Arial,sans-serif}
body{padding:22px}.title{font-size:20px;margin:0 0 7px}.note{opacity:.7;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(6,210px);gap:16px;width:max-content}
.case{width:210px}.label{height:34px;margin:5px 0;font-weight:700;font-size:13px}
.card{position:relative;width:210px;height:180px;padding:16px;overflow:hidden;border-radius:24px;isolation:isolate;background:
radial-gradient(circle at 16% 18%,#3fcaff 0 16%,transparent 42%),
radial-gradient(circle at 83% 18%,#eed23c 0 14%,transparent 40%),
radial-gradient(circle at 64% 78%,#ea4263 0 18%,transparent 45%),
linear-gradient(135deg,#1e763d,#18284b 55%,#73502d)}
.card:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(4,8,11,.08),rgba(4,8,11,.20))}
.card:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,rgba(3,7,9,.03),rgba(3,7,9,.10) 48%,rgba(3,7,9,.18))}
.panel{position:relative;z-index:2;width:100%;height:100%;border-radius:22px;padding:12px;overflow:visible;border:1px solid rgba(158,223,211,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.025),0 20px 46px rgba(0,0,0,.11)}
.panel.pseudos:before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:rgba(0,0,0,.58)}
.panel.pseudos:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:rgba(0,0,0,.58)}
.panel.no-pseudos:before,.panel.no-pseudos:after{content:none!important}
.control{border-radius:0;border:0;background:#26333a;box-shadow:none}
.flat{background-color:rgba(18,29,33,.16);background-image:linear-gradient(128deg,rgba(147,194,199,.11),rgba(28,39,42,.13) 42%,rgba(106,86,52,.095))}
.glass,.appglass{background-color:rgba(18,29,33,.16);background-image:linear-gradient(128deg,rgba(147,194,199,.11),rgba(28,39,42,.13) 42%,rgba(106,86,52,.095));backdrop-filter:blur(20px) saturate(1.18);-webkit-backdrop-filter:blur(20px) saturate(1.18)}
.html2canvas-capture .appglass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background-color:rgba(30,43,47,.24)!important;background-image:linear-gradient(128deg,rgba(133,174,179,.16),rgba(34,47,50,.20) 46%,rgba(111,91,59,.13))!important;overflow:hidden}
.html2canvas-capture.keep-overflow .appglass{overflow:visible}
.row{position:relative;z-index:2;display:grid;grid-template-columns:26px 1fr auto;align-items:center;height:44px;border-bottom:1px solid rgba(255,255,255,.115);font-size:12px}.row:last-child{border:0}
.score{padding:6px 8px;border:1px solid rgba(177,210,222,.23);border-radius:11px;background:rgba(108,132,141,.27)}
.result{margin-top:8px;width:210px;min-height:180px;background:#12161b;border:1px solid #333}.result img{display:block;width:210px;height:auto}
.metric{font:10px monospace;color:#9fb1ba;margin-top:5px;white-space:pre-wrap}
</style>
</head>
<body>
<h1 class="title">html2canvas 1.4.1 — clon y superficies</h1>
<p class="note">Arriba: DOM de Chrome · Abajo: PNG. Las columnas 5–6 cambian estilos únicamente dentro del clon de html2canvas.</p>
<div class="grid" id="grid"></div>
<script>
const cases=[
  {name:"1. Control básico",cls:"control",mode:"none"},
  {name:"2. Glass sin backdrop",cls:"flat",mode:"none"},
  {name:"3. Backdrop activo",cls:"glass",mode:"none"},
  {name:"4. Backdrop + pseudos",cls:"glass pseudos",mode:"none"},
  {name:"5. Clon: ocultar pseudos",cls:"glass pseudos",mode:"hide-pseudos"},
  {name:"6. Clon actual de la app",cls:"appglass",mode:"capture"},
  {name:"7. Clon app sin overflow hidden",cls:"appglass",mode:"capture-visible"}
];
const grid=document.getElementById("grid");
for(const item of cases){
 const c=document.createElement("div");c.className="case";c.dataset.mode=item.mode;
 c.innerHTML='<div class="label">'+item.name+'</div><div class="card"><div class="panel '+item.cls+'"><div class="row"><span>01</span><span>Track one</span><b class="score">9.0</b></div><div class="row"><span>02</span><span>Track two</span><b class="score">8.8</b></div><div class="row"><span>03</span><span>Track three</span><b class="score">9.1</b></div></div></div><div class="result"></div><div class="metric">pendiente</div>';
 grid.append(c);
}
async function run(){
 await document.fonts.ready;await new Promise(r=>setTimeout(r,500));
 for(const c of document.querySelectorAll(".case")){
  const mode=c.dataset.mode;
  const canvas=await html2canvas(c.querySelector(".card"),{
    backgroundColor:null,scale:2,useCORS:true,allowTaint:true,logging:false,ignoreElements:()=>false,
    onclone:d=>{
      const cc=d.querySelector('.case[data-mode="'+mode+'"] .card');
      if(mode==="hide-pseudos") cc.querySelector(".panel").classList.add("no-pseudos");
      if(mode==="capture") cc.classList.add("html2canvas-capture");
      if(mode==="capture-visible") cc.classList.add("html2canvas-capture","keep-overflow");
    }
  });
  const img=new Image();img.alt="PNG rasterizado";img.src=canvas.toDataURL("image/png");c.querySelector(".result").append(img);
  const ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height;
  const lum=y=>{const p=ctx.getImageData(0,y,w,1).data;let s=0;for(let i=0;i<p.length;i+=4)s+=(p[i]+p[i+1]+p[i+2])/3;return s/(p.length/4)};
  const ys=[4,30,60,100,180,300,350].filter(y=>y<h);
  c.querySelector(".metric").textContent=canvas.width+"x"+canvas.height+" | "+ys.map(y=>y+":"+lum(y).toFixed(0)).join(" ");
 }
 document.body.dataset.done="yes";
}
run().catch(e=>{document.body.dataset.done="error";document.body.dataset.err=e.stack||e.message});
</script>
</body>
</html>
