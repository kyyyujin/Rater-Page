<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Master export architecture audit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#090d12;color:#f4f5f1;font:14px Arial,sans-serif}.wrap{max-width:1120px;margin:auto}h1{margin:0 0 8px}.sub{opacity:.7;margin:0 0 22px}
.stage{display:grid;grid-template-columns:360px 1fr;gap:24px}.master-shell{min-width:0}.source{width:320px;padding:22px;border-radius:26px;background:radial-gradient(circle at 15% 15%,#42c9ff,transparent 38%),radial-gradient(circle at 80% 76%,#ef476f,transparent 44%),linear-gradient(135deg,#245f39,#2a315e 55%,#846632)}
.source.capture-ready .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(135deg,rgba(126,177,185,.24),rgba(24,39,45,.32));}
.glass{border:1px solid rgba(170,225,215,.42);border-radius:21px;padding:18px;background:rgba(17,30,35,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px rgba(255,255,255,.13)}
.track{display:grid;grid-template-columns:28px 1fr auto;align-items:center;height:52px;border-bottom:1px solid rgba(255,255,255,.12)}.track:last-child{border:0}.score{padding:7px 9px;border:1px solid rgba(220,255,220,.25);border-radius:10px}
.hidden{display:none!important}#preview{display:block;width:320px;height:auto;border-radius:18px;border:1px solid rgba(170,225,215,.42)}
table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden}th,td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;font-family:monospace}th{color:#b9dfe8}tr:last-child td{border-bottom:0}.ok{color:#c8f060}.bad{color:#ff7080}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{padding:10px 13px;border:1px solid #426572;border-radius:9px;background:#17272e;color:white;cursor:pointer}code{display:block;margin-top:18px;padding:14px;border-radius:12px;background:#111820;white-space:pre-wrap}
</style></head><body><div class="wrap"><h1>Auditoría: una única captura maestra</h1><p class="sub">La preview, PC fijo, Estándar, DB y Discord reutilizan el Blob maestro. Móvil y Alta res solo redimensionan sus píxeles.</p>
<div class="stage"><div class="master-shell"><div id="source" class="source"><div class="glass"><h2>MASTER RATING</h2><div class="track"><span>01</span><span>Track one</span><b class="score">9.0</b></div><div class="track"><span>02</span><span>Track two</span><b class="score">8.8</b></div><div class="track"><span>03</span><span>Track three</span><b class="score">9.1</b></div></div></div><img id="preview" alt="Preview maestra"></div>
<div><table><thead><tr><th>Salida</th><th>Dimensiones</th><th>Origen</th><th>MAE visual</th><th>Hash</th></tr></thead><tbody id="results"></tbody></table>
<div class="actions" id="actions"></div><code id="summary">Generando…</code></div></div></div>
<script>
const MASTER_EXPORT_SCALE=2;let cachedPcExportBlob=null,cachedPcExportUrl="";let html2canvasCalls=0;const variants=new Map();
const canvasToPngBlob=canvas=>new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("PNG")),"image/png"));
async function sha(blob){const digest=await crypto.subtle.digest("SHA-256",await blob.arrayBuffer());return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,"0")).join("")}
async function captureMaster(){const source=document.querySelector("#source");source.classList.add("capture-ready");try{html2canvasCalls++;return await html2canvas(source,{backgroundColor:null,scale:MASTER_EXPORT_SCALE,useCORS:true,allowTaint:true,logging:false,ignoreElements:()=>false})}finally{source.classList.remove("capture-ready")}}
async function resizeMasterExportBlob(masterBlob,exportScale){const ratio=exportScale/MASTER_EXPORT_SCALE;if(Math.abs(ratio-1)<.0001)return masterBlob;const bitmap=await createImageBitmap(masterBlob);try{const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));const context=canvas.getContext("2d",{alpha:true});context.imageSmoothingEnabled=true;context.imageSmoothingQuality="high";context.drawImage(bitmap,0,0,canvas.width,canvas.height);return await canvasToPngBlob(canvas)}finally{bitmap.close()}}
async function dims(blob){const b=await createImageBitmap(blob);const d=[b.width,b.height];b.close();return d}
async function mae(blob,masterBlob){const [a,b]=await Promise.all([createImageBitmap(blob),createImageBitmap(masterBlob)]);try{const w=b.width,h=b.height,c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(b,0,0,w,h);const p=x.getImageData(0,0,w,h).data;x.clearRect(0,0,w,h);x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(a,0,0,w,h);const q=x.getImageData(0,0,w,h).data;let sum=0;for(let i=0;i<p.length;i+=4)sum+=Math.abs(p[i]-q[i])+Math.abs(p[i+1]-q[i+1])+Math.abs(p[i+2]-q[i+2]);return sum/(w*h*3)}finally{a.close();b.close()}}
async function run(){const masterCanvas=await captureMaster();cachedPcExportBlob=await canvasToPngBlob(masterCanvas);cachedPcExportUrl=URL.createObjectURL(cachedPcExportBlob);const preview=document.querySelector("#preview");preview.src=cachedPcExportUrl;await preview.decode();document.querySelector("#source").classList.add("hidden");
const outputs=[["Preview",cachedPcExportBlob,"master"],["PC fijo",cachedPcExportBlob,"same Blob"],["Estándar",cachedPcExportBlob,"same Blob"],["Móvil",await resizeMasterExportBlob(cachedPcExportBlob,1),"scaled master"],["Alta res",await resizeMasterExportBlob(cachedPcExportBlob,3),"scaled master"],["Guardar DB",cachedPcExportBlob,"same Blob"],["Discord",cachedPcExportBlob,"same Blob"]];
const masterHash=await sha(cachedPcExportBlob);const body=document.querySelector("#results"),actions=document.querySelector("#actions");
for(const [name,blob,origin] of outputs){const [w,h]=await dims(blob),hash=await sha(blob),error=await mae(blob,cachedPcExportBlob);variants.set(name,blob);const tr=document.createElement("tr");tr.innerHTML="<td>"+name+"</td><td>"+w+"×"+h+"</td><td>"+origin+"</td><td>"+error.toFixed(3)+"</td><td class='"+((origin==="same Blob"||origin==="master")&&hash===masterHash?"ok":"")+"'>"+hash.slice(0,12)+"…</td>";body.append(tr);if(["PC fijo","Estándar","Móvil","Alta res"].includes(name)){const btn=document.createElement("button");btn.textContent="Descargar "+name;btn.dataset.variant=name;btn.onclick=()=>{const b=variants.get(name),url=b===cachedPcExportBlob?cachedPcExportUrl:URL.createObjectURL(b),a=document.createElement("a");a.download="master-audit-"+name.toLowerCase().replace(/\s+/g,"-")+".png";a.href=url;a.click();if(b!==cachedPcExportBlob)setTimeout(()=>URL.revokeObjectURL(url),1000)};actions.append(btn)}}
document.querySelector("#summary").textContent="html2canvas_calls="+html2canvasCalls+"\nmaster_sha256="+masterHash+"\npc_fixed_same_object="+(variants.get("PC fijo")===cachedPcExportBlob)+"\nstandard_same_object="+(variants.get("Estándar")===cachedPcExportBlob)+"\ndb_same_object="+(variants.get("Guardar DB")===cachedPcExportBlob)+"\ndiscord_same_object="+(variants.get("Discord")===cachedPcExportBlob);document.body.dataset.done="yes"}
run().catch(e=>{document.querySelector("#summary").textContent=e.stack||e.message;document.body.dataset.done="error"})
</script></body></html>
