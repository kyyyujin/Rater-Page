<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Blob identity audit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body{margin:0;padding:32px;background:#0a0d12;color:#eef;font:14px Arial}.wrap{max-width:760px;margin:auto}.row{display:flex;gap:24px;align-items:flex-start}
#source{width:320px;height:220px;padding:24px;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 15% 20%,#38c9ff,transparent 38%),radial-gradient(circle at 80% 70%,#ef4663,transparent 40%),linear-gradient(135deg,#276b3a,#7a632c)}
.glass{height:100%;padding:18px;border-radius:22px;border:1px solid rgba(180,230,220,.4);background:rgba(20,35,42,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.capture .glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(44,62,67,.35)}
#preview{display:block;width:320px;height:auto;border:1px solid #59636d}.hidden{display:none!important}
button{margin-top:18px;padding:12px 18px;border:1px solid #87b5c0;background:#18303a;color:#fff;border-radius:10px;cursor:pointer}
code{display:block;margin:16px 0;padding:14px;background:#121820;white-space:pre-wrap;word-break:break-all}
</style></head><body><div class="wrap"><h1>Auditoría de identidad del Blob</h1><p>El DOM se rasteriza una vez. Ese Blob alimenta tanto el &lt;img&gt; como la descarga.</p><div class="row">
<div id="source"><div class="glass"><h2>Preview source</h2><p>Una sola rasterización.</p><strong>9.1</strong></div></div>
<img id="preview" alt="Preview PNG exacta"></div><button id="download" disabled>Descargar el mismo Blob</button><code id="result">Generando…</code></div>
<script>
let cachedBlob=null,cachedUrl="";
const options={backgroundColor:null,scale:2,useCORS:true,allowTaint:true,logging:false,ignoreElements:()=>false,onclone:d=>d.querySelector("#source")?.classList.add("capture")};
async function hashBlob(blob){const digest=await crypto.subtle.digest("SHA-256",await blob.arrayBuffer());return [...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,"0")).join("")}
async function run(){const source=document.querySelector("#source");const canvas=await html2canvas(source,options);cachedBlob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("blob")),"image/png"));cachedUrl=URL.createObjectURL(cachedBlob);const preview=document.querySelector("#preview");preview.src=cachedUrl;await preview.decode();source.classList.add("hidden");const hash=await hashBlob(cachedBlob);document.querySelector("#result").textContent="preview_blob_sha256="+hash+"\nbytes="+cachedBlob.size+"\nobject_url="+cachedUrl+"\nhtml2canvas_calls=1";const btn=document.querySelector("#download");btn.disabled=false;btn.onclick=()=>{const a=document.createElement("a");a.download="blob-identity-audit.png";a.href=cachedUrl;a.click()};document.body.dataset.done="yes"}run().catch(e=>{document.querySelector("#result").textContent=e.stack||e.message;document.body.dataset.done="error"})
</script></body></html>
